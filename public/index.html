<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAYBAY Crew</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#23201c; --muted:#6e665c; --line:#ece5da; --soft:#f5f0e8;
  --teal:#1f8a85; --scout:#e07a2f; --planner:#7a5cc7; --checker:#3a9a4a; --user:#8a8f98;
  --ok:#2fa84f; --bad:#d64545; --warn:#e3a21a;
  --radius:14px; --shadow:0 1px 2px rgba(60,40,20,.05),0 6px 22px rgba(60,40,20,.07);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
textarea:focus-visible,.datein:focus-visible{outline:none}

/* top bar */
.top{display:flex;align-items:center;gap:12px 16px;padding:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 340px}
.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--teal) 0%,#3aa39d 45%,var(--scout) 100%);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 6px 16px rgba(31,138,133,.25)}
.brand h1{margin:0;font-size:20px;line-height:1.2;letter-spacing:-.01em}
.brand h1 span{color:var(--teal)}
.brand p{margin:1px 0 0;color:var(--muted);font-size:13px}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.pill{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;max-width:330px;min-width:0;box-shadow:var(--shadow);cursor:default}
.pill .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#c4bcb0;flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(47,168,79,.16)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(214,69,69,.14)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(227,162,26,.18)}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;flex:none;box-shadow:var(--shadow)}
.langsw button{border:0;background:none;padding:6px 13px;cursor:pointer;font-size:13px;color:var(--muted)}
.langsw button.on{background:var(--ink);color:#fff}

/* layout */
main{flex:1;min-height:0;display:grid;grid-template-columns:30fr 38fr 32fr;gap:14px;padding:0 20px 16px}
.col{min-height:0;min-width:0;display:flex;flex-direction:column;gap:14px}
.col.left{overflow:auto;padding:2px 2px 4px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(80,60,30,.05);min-width:0}

/* ask */
.ask{padding:16px}
.lbl{font-weight:700;display:block;margin:0 0 8px;font-size:15px}
textarea{display:block;width:100%;resize:vertical;min-height:88px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fffdfa;color:var(--ink);outline:none}
textarea:focus,.datein:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,138,133,.13)}
.row{display:flex;gap:10px;margin-top:10px;align-items:flex-end;flex-wrap:wrap}
.date{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:3px}
.datein{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;background:#fffdfa;color:var(--ink);outline:none;height:46px}
.go{flex:1;min-width:150px;height:46px;border:0;border-radius:12px;background:linear-gradient(135deg,#17736f,#1b7f7a);color:#fff;font-size:16px;font-weight:700;padding:0 18px;cursor:pointer;box-shadow:0 6px 16px rgba(31,138,133,.28);transition:transform .12s ease,box-shadow .12s ease}
.go:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(31,138,133,.34)}
.go:disabled{opacity:.65;cursor:progress;transform:none}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.datenote{color:#8f590c;background:#fdf5e6;border-radius:8px;padding:5px 9px}
.chips-lbl{font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fffdfa;border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;text-align:left;line-height:1.35;max-width:100%}
.chip:hover{border-color:var(--teal);color:var(--teal);background:#fff}

/* plan */
.plan{padding:16px}
.plan-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.plan-h h2{margin:0;font-size:15px}
.plan-h .meta{font-size:12px;color:var(--muted)}
.plan-title{font-size:18px;font-weight:800;margin:8px 0 2px;line-height:1.3}
.muted{color:var(--muted)}
.empty-note{color:var(--muted);font-size:13px;margin:8px 0 0}
.skel{margin-top:12px;display:grid;gap:10px}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#f1ebe1 0%,#f8f4ee 50%,#f1ebe1 100%);background-size:200% 100%;animation:shim 1.2s linear infinite}
.skel i:nth-child(2){width:80%}.skel i:nth-child(3){width:60%}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.stops{list-style:none;margin:12px 0 0;padding:0}
.stop{display:grid;grid-template-columns:52px 1fr;gap:10px}
.st-time{font-weight:800;font-variant-numeric:tabular-nums;color:#19716d;text-align:right;padding-top:1px;font-size:13.5px}
.st-body{border-left:2px solid var(--line);padding:0 0 16px 14px;position:relative;min-width:0}
.st-body::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--teal)}
.stop:last-child .st-body{padding-bottom:4px}
.st-name{font-weight:700;font-size:14.5px;line-height:1.35;word-break:break-word}
.st-name a{color:var(--ink);text-decoration:none;border-bottom:1px solid #d9cfc0}
.st-name a:hover{color:var(--teal);border-bottom-color:var(--teal)}
.st-where{color:var(--muted);font-size:12.5px}
.st-why{font-size:13px;margin-top:3px}
.st-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;align-items:center}
.tag{border-radius:999px;padding:1px 8px;line-height:1.6}
.tag.free{background:#e3f4e6;color:#1f7a34;font-weight:800;letter-spacing:.04em}
.tag.tr{background:#eef3fb;color:#2c5b94}
.tag.who{background:#f4efe6;color:#5e564a}
.tag.vok{background:#eef8f0;color:#23753a;font-weight:700}
.tag.vno{background:#fdf5e6;color:#8f590c;font-weight:600}
.notes{margin:10px 0 0;padding:10px 12px 10px 28px;background:var(--soft);border-radius:10px;font-size:12.5px}
.notes li+li{margin-top:3px}
.verdict{margin-top:12px;border-radius:12px;padding:10px 12px;background:#eef8f0;color:#256b33;font-weight:700;font-size:13.5px;border:1px solid #d3ecd8}
.verdict.no{background:#fdf0ef;color:#a33;border-color:#f3d2cf}
.verdict ul{margin:6px 0 0;padding-left:18px;font-weight:500;font-size:12.5px}
.verdict .sub{font-weight:600;font-size:12px;margin-top:6px;opacity:.85}
.verdict .review{font-weight:500;font-size:12.5px;margin-top:4px}

/* room */
.room{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.room-h{padding:12px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.room-h .r1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.room-h h2{margin:0;font-size:15px}
.transport{font-family:var(--mono);font-size:11.5px;color:var(--muted);word-break:break-all}
.transport b{color:var(--ink);font-weight:600}
.agents{display:flex;gap:6px;flex-wrap:wrap}
.agent{--c:#888;display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 3px;background:#fffdfa}
.agent .av{width:18px;height:18px;font-size:10px}
.agent b{color:var(--c);color:color-mix(in srgb,var(--c) 70%,#000)}
.agent .dot{width:7px;height:7px;box-shadow:none}
.conn{font-size:11.5px;color:#8f590c;background:#fdf5e6;border-radius:8px;padding:3px 8px;align-self:flex-start}
.trace{flex:1;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.av{--c:#888;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.msg{--c:#888;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:8px 12px 10px;max-width:94%;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.03);animation:pop .22s ease-out;min-width:0}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;margin-bottom:3px}
.mh .who{font-weight:800;color:var(--c);color:color-mix(in srgb,var(--c) 70%,#000);font-size:13px}
.mh .arrow{color:var(--muted)}
.mh .tm{margin-left:auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.mh .kind{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--soft);border-radius:6px;padding:0 6px}
.at{--c:#888;background:#f3f0ea;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);color:color-mix(in srgb,var(--c) 70%,#000);border-radius:999px;padding:0 7px;font-weight:700;font-size:11.5px;white-space:nowrap}
.txt{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.mention{color:var(--c);color:color-mix(in srgb,var(--c) 70%,#000);font-weight:700}
.msg.me{align-self:flex-end;border-left-width:1px;border-right:4px solid var(--c);background:#f7f5f1}
.msg.minor{background:var(--soft);border-color:transparent;border-left:3px solid var(--c);font-size:12.5px;color:#5f584f;padding:5px 10px 7px;margin-left:26px;max-width:calc(94% - 26px);box-shadow:none}
.msg.minor .mh{font-size:11px}
.msg.minor .who{font-size:11.5px}
.msg.k-task{border-style:dashed;border-left-style:solid}
.msg.k-error{border-left-color:var(--bad);background:#fff5f4}
pre.code{font-family:var(--mono);font-size:11.5px;line-height:1.45;background:#fbf9f5;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 0;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;color:#3b3229}
details.fold summary{cursor:pointer;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.fold[open] summary{margin-bottom:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badges:empty{display:none}
.llm{font-size:11px;font-family:var(--mono);background:#fff4e6;border:1px solid #f3d6b0;color:#8a4b12;border-radius:999px;padding:1px 8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.sys{align-self:center;font-size:12px;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 12px;text-align:center;max-width:100%}
.sys.err{color:#a33;background:#fdf0ef}
.sys.done{color:#256b33;background:#eef8f0;font-weight:700}
.empty{margin:auto 0;padding:10px 4px;color:var(--muted);font-size:13px}
.empty p{margin:0 0 12px}
.crew{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.crew li{--c:#888;display:flex;align-items:center;gap:9px;background:#fffdfa;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 10px}
.crew b{color:var(--c);color:color-mix(in srgb,var(--c) 70%,#000);min-width:62px}
.thinking{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);background:#fffdfa}
.dots{display:inline-flex;gap:4px}
.dots i{--c:#888;display:block;width:9px;height:9px;border-radius:50%;background:var(--c);animation:pulse 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.75)}50%{opacity:1;transform:scale(1.15)}}
.stats{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.stat{background:var(--soft);border-radius:999px;padding:2px 10px;white-space:nowrap}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}

/* right */
.right{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tabs button{border:0;background:none;font-weight:700;padding:9px 12px 8px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--teal)}
.cnt{background:#b85a17;color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;margin-left:5px;font-weight:700}
.panel{display:none;flex:1;min-height:0;flex-direction:column}
.panel.on{display:flex}
.gbar{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:var(--muted);flex:none;flex-wrap:wrap}
.gbar .info{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.gwrap{position:relative;flex:1;min-height:0;background:radial-gradient(circle at 50% 40%,#fffdf9 0%,#f8f3ea 100%);border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
#net{position:absolute;inset:0}
.gmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:20px;pointer-events:none}
.legend{position:absolute;left:10px;bottom:10px;right:10px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:#5f584f;pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.88);border-radius:999px;padding:2px 8px 2px 6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(0,0,0,.18)}
.sw.box{border-radius:2px;width:12px;height:8px}
.sw.diamond{border-radius:1px;transform:rotate(45deg);width:8px;height:8px}
.sw.square{border-radius:1px}
.sw.big{width:13px;height:13px}
div.vis-tooltip{font-family:inherit !important;font-size:12px !important;background:#fff !important;border:1px solid var(--line) !important;border-radius:8px !important;box-shadow:var(--shadow) !important;padding:6px 9px !important;max-width:280px;white-space:normal !important;color:var(--ink) !important}
.vtip b{display:block}
.vtip .k{color:var(--muted);font-size:11px}
.scroll{flex:1;min-height:0;overflow:auto;padding:12px}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.dhead h3{margin:0;font-size:15px}
.dhead p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.dq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;background:#fff}
.dq h4{margin:0 0 4px;font-size:14px}
.dq details summary{cursor:pointer;color:#19716d;font-size:12px;font-weight:600}
.tw{overflow:auto;max-height:280px;margin-top:8px;border-radius:8px;border:1px solid #f1ebe2}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;position:sticky;top:0;background:#faf6ef;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid #f4efe7;vertical-align:top;word-break:break-word}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.cy{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:#fff;animation:pop .22s ease-out}
.cyh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.cyh .who{--c:#888;color:var(--c);color:color-mix(in srgb,var(--c) 70%,#000);font-weight:800}
.cyh .tm{margin-left:auto}
.cyh .rows{background:#eaf2fb;color:#2c5b94;border-radius:999px;padding:0 7px;font-weight:700}
.cyh .eng{background:#fdf5e6;color:#8f590c;border-radius:999px;padding:0 7px;font-weight:600}
.cyh .eng.neo{background:#e6f3f2;color:#19716d}

@media (max-width:1100px){
  html,body{height:auto}
  body{overflow:auto}
  main{grid-template-columns:1fr;padding:0 16px 16px}
  .col.left{overflow:visible;padding:0}
  .room{height:72vh;min-height:420px;flex:none}
  .right{height:600px;flex:none}
}
@media (max-width:560px){
  .top{padding:12px 16px}
  .brand{flex-basis:100%}
  .brand h1{font-size:18px}
  .pills{width:100%}
  .pill{max-width:100%}
  .stop{grid-template-columns:44px 1fr;gap:8px}
  .msg,.msg.minor{max-width:100%}
  .msg.minor{margin-left:12px}
  .right{height:520px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true">B</div>
    <div style="min-width:0">
      <h1>BAYBAY <span>Crew</span></h1>
      <p data-i18n="subtitle"></p>
    </div>
  </div>
  <div class="pills">
    <span class="pill" id="pCrusoe"></span>
    <span class="pill" id="pNeo"></span>
    <span class="pill" id="pBand"></span>
  </div>
  <div class="langsw" role="group" aria-label="Language">
    <button type="button" data-lang="zh" lang="zh-CN" aria-pressed="false">中文</button>
    <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<main>
  <div class="col left">
    <section class="card ask">
      <label class="lbl" for="q" data-i18n="askLabel"></label>
      <textarea id="q" rows="3" maxlength="500"></textarea>
      <div class="row">
        <label class="date"><span data-i18n="dateLabel"></span><input type="date" id="date" class="datein"></label>
        <button type="button" id="go" class="go"></button>
      </div>
      <div class="hint datenote" id="dateNote" aria-live="polite" hidden></div>
      <div class="hint" data-i18n="hint"></div>
      <div class="chips-lbl" data-i18n="try"></div>
      <div class="chips" id="chips"></div>
    </section>
    <section class="card plan" id="plan" aria-live="polite"></section>
  </div>

  <div class="col mid">
    <section class="card room">
      <div class="room-h">
        <div class="r1"><h2 id="roomTitle" data-i18n="roomTitle"></h2><span class="transport" id="transport"></span></div>
        <div class="agents" id="agents"></div>
        <div class="conn" id="conn" role="status" hidden></div>
      </div>
      <div class="trace" id="trace" role="log" aria-live="polite" aria-labelledby="roomTitle"></div>
      <div class="thinking" id="thinking" role="status" hidden></div>
      <div class="stats" id="stats" hidden></div>
    </section>
  </div>

  <div class="col rightcol">
    <section class="card right">
      <nav class="tabs" id="tabs" role="tablist">
        <button type="button" data-tab="graph" class="on" role="tab" id="t-graph" aria-controls="p-graph" aria-selected="true"><span data-i18n="tabGraph"></span></button>
        <button type="button" data-tab="dash" role="tab" id="t-dash" aria-controls="p-dash" aria-selected="false"><span data-i18n="tabDash"></span></button>
        <button type="button" data-tab="cypher" role="tab" id="t-cypher" aria-controls="p-cypher" aria-selected="false"><span data-i18n="tabCypher"></span><span class="cnt" id="cypherCnt" hidden></span></button>
      </nav>
      <div class="panel on" id="p-graph" role="tabpanel" aria-labelledby="t-graph">
        <div class="gbar">
          <span class="info" id="ginfo"></span>
          <button type="button" class="btn" id="gOverview" hidden></button>
          <button type="button" class="btn" id="gFit"></button>
        </div>
        <div class="gwrap">

      var lists = [[ok ? c.fixed : c.issues, ok ? 'fixedAlong' : 'openIssues'], [c.suggested, 'reviewAsked'], [c.notApplied, 'notApplied']];
      el.append(h('div', { 'class': 'verdict' + (ok ? '' : ' no') },
        ok ? '✓ ' + (rounds <= 1 ? t('approved1') : t('approved', { n: rounds })) : '✗ ' + t('rejected', { n: rounds }),
        review ? h('div', { 'class': 'review', text: review }) : null,
        lists.map(function (l) {
          var list = Array.isArray(l[0]) ? l[0].filter(Boolean) : [];
          return list.length ? [h('div', { 'class': 'sub', text: t(l[1]) }), h('ul', null, list.map(function (x) { return h('li', { text: typeof x === 'string' ? x : JSON.stringify(x) }); }))] : null;
        })));
    }
  }

  /* ---------- graph ---------- */
  function kindLabel(k) { return I18N[lang]['k_' + k] ? t('k_' + k) + (lang === 'zh' ? ' · ' + k : '') : (k || t('k_Other')); }
  function tipKind(n, full) { return kindLabel(n.kind) + (n.title && n.title !== full ? ' · ' + full : ''); }
  function nodeStyle(kind) {
    var base = KIND[kind] || { shape: 'dot', size: 9, color: { background: '#c9c1b5', border: '#a39a8c' } };
    var st = JSON.parse(JSON.stringify(base));
    var c = st.color;
    c.highlight = { background: c.background, border: '#1f2a2a' };
    c.hover = { background: c.background, border: '#1f8a85' };
    return st;
  }
  function tipEl(n, full) {
    var k = h('div', { 'class': 'k', text: tipKind(n, full) });
    tips.push({ el: k, n: n, full: full }); // re-translated by applyLang
    return h('div', { 'class': 'vtip' }, h('b', { text: String(n.title || full) }), k);
  }
  function visOpts(big) {
    return {
      autoResize: true,
      layout: { improvedLayout: !big, randomSeed: 7 },
      physics: {
        enabled: true, solver: 'forceAtlas2Based',
        forceAtlas2Based: { gravitationalConstant: big ? -36 : -60, centralGravity: 0.012, springLength: big ? 70 : 100, springConstant: 0.07, damping: 0.5, avoidOverlap: 0.3 },
        maxVelocity: 60, minVelocity: 1,
        stabilization: { enabled: true, iterations: big ? 260 : 400, updateInterval: 50, fit: true }
      },
      interaction: { hover: true, tooltipDelay: 120, hideEdgesOnDrag: big },
      nodes: { font: { face: FONT, size: 12, color: '#3a342c', strokeWidth: 3, strokeColor: 'rgba(255,255,255,0.9)' }, borderWidth: 1.5 },
      edges: {
        color: { color: '#d6ccbc', highlight: '#1f8a85', hover: '#1f8a85' }, width: 1,
        smooth: { enabled: true, type: 'continuous', roundness: 0.4 },
        arrows: { to: { enabled: true, scaleFactor: 0.35 } },
        font: { face: FONT, size: 9, color: '#9a8f80', strokeWidth: 3, strokeColor: '#ffffff', align: 'middle' }
      }
    };
  }
  function graphMsg(content) { var m = $('#gmsg'); m.replaceChildren(); appendKid(m, content || null); m.hidden = !content; }
  function countGraph(d) { return { n: d && Array.isArray(d.nodes) ? d.nodes.length : 0, e: d && Array.isArray(d.edges) ? d.edges.length : 0 }; }
  function renderGraphInfo() {
    var info = $('#ginfo');
    $('#gOverview').hidden = !(graphMode === 'run' && overviewData);
    if (!graphData) { info.textContent = overviewState === 'fail' ? t('graphErr') : t('graphLoading'); return; }
    var c = countGraph(graphData);
    info.textContent = t(graphMode === 'run' ? 'showingRun' : 'showingOverview', { n: fmtNum(c.n), e: fmtNum(c.e) });
  }
  function renderLegend() {
    var kinds = [];
    if (graphData && Array.isArray(graphData.nodes)) graphData.nodes.forEach(function (n) { if (n && kinds.indexOf(n.kind) < 0) kinds.push(n.kind); });
    if (!kinds.length) kinds = Object.keys(KIND);
    var order = Object.keys(KIND);
    kinds.sort(function (a, b) { var ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    $('#legend').replaceChildren.apply($('#legend'), kinds.map(function (k) {
      var st = KIND[k] || { shape: 'dot', color: { background: '#c9c1b5', border: '#a39a8c' } };
      var cls = 'sw ' + (SW[st.shape] || '') + (k === 'Neighborhood' ? ' big' : '');
      return h('span', null, h('i', { 'class': cls, style: 'background:' + st.color.background + ';border-color:' + st.color.border }), I18N[lang]['k_' + k] ? t('k_' + k) : String(k || t('k_Other')));
    }));
  }
  function drawGraph(data, mode) {
    graphData = data || { nodes: [], edges: [] }; graphMode = mode;
    renderGraphInfo(); renderLegend();
    if (visState !== 'ready') { if (visState === 'fail') graphMsg(tr('graphFail')); return; }
    var nodes = [], seen = {};
    tips = [];
    (Array.isArray(graphData.nodes) ? graphData.nodes : []).forEach(function (n) {
      if (!n || n.id == null) return;
      var id = String(n.id);
      if (seen[id]) return; seen[id] = true;
      var st = nodeStyle(n.kind);
      var full = String(n.label != null && n.label !== '' ? n.label : (n.title || id));
      st.id = id; st.label = trunc(full, n.kind === 'Neighborhood' ? 26 : 22); st.title = tipEl(n, full);
      nodes.push(st);
    });
    var edges = [], rawE = Array.isArray(graphData.edges) ? graphData.edges : [];
    var showLabels = rawE.length <= 80;
    rawE.forEach(function (e, i) {
      if (!e) return;
      var f = String(e.from), to = String(e.to);
      if (!seen[f] || !seen[to]) return;
      var lab = e.label != null ? String(e.label) : '';
      var ed = { id: 'e' + i, from: f, to: to };
      if (lab) { ed.title = h('div', { text: lab }); if (showLabels) ed.label = lab; }
      edges.push(ed);
    });
    if (!nodes.length) { if (network) network.setData({ nodes: [], edges: [] }); graphMsg(tr('graphEmpty')); return; }
    graphMsg('');
    var big = nodes.length > 150;
    try {
      if (!network) {
        network = new vis.Network($('#net'), { nodes: nodes, edges: edges }, visOpts(big));
        network.on('stabilizationIterationsDone', function () {
          network.setOptions({ physics: { enabled: false } });
          network.fit({ animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
        });
      } else {
        network.setOptions(visOpts(big));
        network.setData({ nodes: nodes, edges: edges });
      }
    } catch (e) { graphMsg([tr('graphFail'), ' · ' + (e && e.message)]); }
  }
  function onVisReady() {
    if (visState === 'ready') return;
    if (window.vis && window.vis.Network) {
      visState = 'ready';
      if (graphData) drawGraph(graphData, graphMode);
    } else { visState = 'fail'; graphMsg(tr('graphFail')); }
  }
  (function () {
    var vs = document.getElementById('visjs');
    if (window.vis && window.vis.Network) { visState = 'ready'; return; }
    if (vs) {
      vs.addEventListener('load', onVisReady);
      vs.addEventListener('error', function () { visState = 'fail'; graphMsg(tr('graphFail')); });
    }
    setTimeout(function () { if (visState === 'loading') { if (window.vis && window.vis.Network) onVisReady(); else { visState = 'fail'; graphMsg(tr('graphFail')); } } }, 20000);
  })();
  graphMsg(tr('graphLoading'));
  function loadOverview() {
    fetch('/api/graph/overview', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        overviewData = j; overviewState = 'ok';
        if (!R.started || graphMode !== 'run') drawGraph(j, 'overview'); else renderGraphInfo();
      })
      .catch(function () {
        overviewState = 'fail';
        if (!graphData) { graphMsg(tr('graphErr')); renderGraphInfo(); }
      });
  }
  $('#gOverview').addEventListener('click', function () { if (overviewData) drawGraph(overviewData, 'overview'); });
  $('#gFit').addEventListener('click', function () { if (network) network.fit({ animation: { duration: 300 } }); });

  /* ---------- tabs ---------- */
  function showTab(name, manual) {
    activeTab = name;
    if (manual) lastManualTab = Date.now();
    $$('#tabs button').forEach(function (b) {
      var on = b.getAttribute('data-tab') === name;
      b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    ['graph', 'dash', 'cypher'].forEach(function (n) { $('#p-' + n).classList.toggle('on', n === name); });
    if (name === 'graph' && network) requestAnimationFrame(function () { network.redraw(); network.fit(); });
    if (name === 'dash' && dashState !== 'ok' && dashState !== 'loading') loadDash();
    if (name === 'cypher') { unseenCypher = 0; renderCnt(); }
  }
  $$('#tabs button').forEach(function (b) { b.addEventListener('click', function () { showTab(b.getAttribute('data-tab'), true); }); });

  /* ---------- dashboard ---------- */
  function cellText(v) {
    v = neoInt(v);
    if (v == null) return '—';
    if (typeof v === 'number') return v.toLocaleString('en-US');
    if (typeof v === 'boolean') return v ? '✓' : '✗';
    if (Array.isArray(v)) return v.map(function (x) { return typeof x === 'object' && x ? JSON.stringify(x) : String(x); }).join(', ');
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  }
  function loadDash() {
    dashState = 'loading'; renderDash();
    fetch('/api/dashboard', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { dash = j; dashState = 'ok'; })
      .catch(function (e) { dashState = 'fail'; dashErr = e && e.message ? e.message : String(e); })
      .then(renderDash);
  }
  function renderDash() {
    var el = $('#dash');
    // the subtitle names Neo4j only when every panel came from Aura (dash.engine === 'neo4j')
    var sub = dashState === 'ok' && dash ? (dash.engine === 'neo4j' ? 'dashSubNeo' : 'dashSubLocal') : 'dashSub';
    var head = h('div', { 'class': 'dhead' },
      h('div', null, h('h3', { text: t('dashTitle') }), h('p', { text: t(sub) })),
      h('button', { type: 'button', 'class': 'btn', text: t('refresh'), onclick: loadDash }));
    el.replaceChildren(head);
    if (dashState === 'loading' || dashState === 'idle') { el.append(h('p', { 'class': 'empty-note', text: t('loading') })); return; }
    if (dashState === 'fail') { el.append(h('p', { 'class': 'empty-note', text: t('dashFail', { msg: dashErr }) })); return; }
    var qs = dash && Array.isArray(dash.queries) ? dash.queries : [];
    qs.forEach(function (q) {
      q = q || {};
      var cols = Array.isArray(q.columns) ? q.columns : [];
      var rows = Array.isArray(q.rows) ? q.rows : [];
      var title = lang === 'zh' ? (q.titleZh || q.title) : (q.title || q.titleZh);
      el.append(h('div', { 'class': 'dq' },
        h('h4', { text: title || 'Query' }),
        q.cypher ? h('details', null, h('summary', { text: 'Cypher' }), h('pre', { 'class': 'code', text: String(q.cypher) })) : null,
        rows.length ? h('div', { 'class': 'tw' }, h('table', null,
          h('thead', null, h('tr', null, cols.map(function (c) { return h('th', { text: I18N.en['col_' + c] ? t('col_' + c) : String(c) }); }))),
          h('tbody', null, rows.slice(0, 100).map(function (r) {
            var arr = Array.isArray(r) ? r : (r && typeof r === 'object' ? cols.map(function (c) { return r[c]; }) : [r]);
            return h('tr', null, arr.map(function (v) {
              var nv = neoInt(v);
              return h('td', { 'class': typeof nv === 'number' ? 'n' : null, text: cellText(v) });
            }));
          })))) : h('p', { 'class': 'empty-note', text: t('noRows') })));
    });
  }

  /* ---------- cypher log ---------- */
  function renderCnt() { var c = $('#cypherCnt'); c.hidden = !unseenCypher; c.textContent = unseenCypher > 99 ? '99+' : String(unseenCypher); }
  // the engine that actually answered: 'Neo4j Aura' or one of the local-graph fallbacks
  function isNeo(ev) { return ev.engine != null ? /^neo4j/i.test(String(ev.engine)) : !!(status && status.neo4j && status.neo4j.mode === 'neo4j'); }
  function engineText(e) {
    e = String(e == null ? '' : e);
    var k = /^neo4j/i.test(e) ? 'eng_neo' : /not configured/i.test(e) ? 'eng_cfg' : /failed/i.test(e) ? 'eng_failed' : /unavailable/i.test(e) ? 'eng_down' : null;
    return k ? t(k) : e;
  }
  function cyEntry(ev) {
    var agent = canon(ev.agent || 'Scout');
    return h('div', { 'class': 'cy' },
      h('div', { 'class': 'cyh' },
        h('span', { 'class': 'who', style: '--c:' + colorOf(agent), text: agent }),
        ev.engine != null ? h('span', { 'class': 'eng' + (ev._neo ? ' neo' : ''), title: String(ev.engine), text: engineText(ev.engine) }) : null,
        h('span', { 'class': 'rows', text: t('rows', { n: fmtNum(ev.rows) }) }),
        h('span', { text: ev.ms != null ? Math.round(Number(ev.ms)) + ' ms' : '' }),
        h('span', { 'class': 'tm', text: ev._t || '' })),
      h('pre', { 'class': 'code', text: String(ev.query || '') }));
  }
  function renderCypherLog() {
    var el = $('#cylog');
    if (!cypherLog.length) { el.replaceChildren(h('p', { 'class': 'empty-note', text: t('cypherEmpty') })); return; }
    el.replaceChildren.apply(el, cypherLog.map(cyEntry));
  }
  function onCypher(ev) {
    ev._t = fmtTime(ev.at); ev._neo = isNeo(ev);
    cypherLog.unshift(ev);
    if (cypherLog.length > 100) cypherLog.length = 100;
    R.cypher++; if (ev._neo) R.cyNeo++;
    var el = $('#cylog');
    if (cypherLog.length === 1) el.replaceChildren();
    el.insertBefore(cyEntry(ev), el.firstChild);
    while (el.children.length > 100) el.removeChild(el.lastChild);
    if (activeTab !== 'cypher') { unseenCypher++; renderCnt(); }
    renderStats();
  }

  /* ---------- SSE ---------- */
  var es = null, connBad = false;
  function renderConn() { var c = $('#conn'); c.hidden = !connBad; c.textContent = t('reconnecting'); }
  function connect() {
    try { es = new EventSource('/api/stream?client=' + encodeURIComponent(clientId)); }
    catch (e) { connBad = true; renderConn(); setTimeout(connect, 3000); return; }
    es.onopen = function () {
      // events sent while the stream was down are not replayed
      if (connBad) { loadStatus(); if (R.active) addSys(tr('connLost'), 'err'); }
      connBad = false; renderConn();
    };
    es.onerror = function () {
      connBad = true; renderConn();
      if (es.readyState === 2) { try { es.close(); } catch (e) {} setTimeout(connect, 3000); }
    };
    es.onmessage = function (m) {
      var ev; try { ev = JSON.parse(m.data); } catch (e) { return; }
      handle(ev);
    };
  }
  function handle(ev) {
    if (!ev || typeof ev !== 'object') return;
    if (ev.type === 'status') { status = ev; statusState = 'ok'; onStatus(); return; }
    // an error that belongs to no run (a Band handler failure) never ends this tab's run: a small notice at most
    if (ev.type === 'error' && ev.runId == null) { if (R.active) addSys(tr('roomNotice', { msg: ev.message || 'unknown' })); return; }
    if (ev.runId != null) {
      if (awaiting && !R.id) { if (buffer.length < 1000) buffer.push(ev); return; }
      if (!R.id || String(ev.runId) !== R.id) return;
    } else if (!R.id) return;
    dispatch(ev);
  }
  function dispatch(ev) {
    try {
      switch (ev.type) {
        case 'room': addRoom(ev); break;
        case 'llm': onLLM(ev); break;
        case 'cypher': onCypher(ev); break;
        case 'graph':
          drawGraph(ev, 'run');
          if (activeTab !== 'graph' && Date.now() - lastManualTab > 10000) showTab('graph', false);
          break;
        case 'plan': R.plan = ev.plan || null; renderPlan(); break;
        case 'error':
          addSys(tr('runError', { msg: ev.message || 'unknown' }), 'err');
          finishRun(null);
          break;
        case 'done':
          finishRun(ev.ms);
          addSys(tr('doneIn', { s: sec(R.ms != null ? R.ms : R.endAt - R.t0) }), 'done');
          break;
        default: break;
      }
    } catch (e) { if (window.console) console.error('event render failed', ev, e); }
  }

  /* ---------- boot ---------- */
  applyLang();
  renderRoomEmpty();
  loadStatus();
  setInterval(loadStatus, 30000);
  loadOverview();
  loadDash();
  connect();
})();
</script>
</body>
</html>
